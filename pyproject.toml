[build-system]
requires = ["setuptools>=69", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["automation_harness/tests"]
markers = [
  "reference: runnable against the synthetic reference backend",
  "ui: exercises UI-oriented behavior",
  "tracking: exercises moving target behavior",
  "integration: crosses process/service boundaries",
  "protected: may only run against an explicitly enabled protected backend",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Incremental blocking gate: syntax, undefined names, unused bindings,
# mutable class state, and file lifetime. Other legacy findings remain in
# the full diagnostic inventory for tracked remediation.
select = ["E9", "F821", "F841", "RUF059", "RUF012", "SIM115"]
