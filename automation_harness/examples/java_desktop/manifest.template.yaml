name: java-desktop-visual-regression
version: 1
requires: [local-only, gui, components, java-accessibility, screen-capture, vision]
backend:
  kind: java-desktop
  # Legacy bundle-mode fixture launcher. New declarative tests should launch
  # application environments with contract-backed script steps instead.
  command: [java, -jar, /absolute/path/to/application.jar]
  startup_timeout: 20
tests: [tests/test_visual_workflow.py]
components: components.yaml
