name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/pytest-*'
      - 'codex/repository-*'
      - 'codex/object-*'
      - 'codex/python-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Python lint and full Ruff baseline
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate full lint inventory and enforce baseline gate
        run: bash scripts/ci/lint.sh
      - name: Upload full Ruff inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-baseline
          path: artifacts/lint/
          if-no-files-found: error

  python:
    name: Python 3.12 tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gcc \
            gir1.2-gtk-3.0 \
            libcairo2-dev \
            libgirepository1.0-dev \
            pkg-config \
            xvfb \
            xauth
      - name: Run Python test suite
        run: bash scripts/ci/unit.sh
      - name: Build and smoke-test a distributable wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install dist/automation_harness-*.whl
          .wheel-smoke/bin/automation-run --help > /dev/null
      - name: Exercise Test Plan GTK action dialog under virtual X11
        run: xvfb-run -a python -m pytest -q --tb=long automation_harness/tests/test_plan_visual_add_action_dialog.py automation_harness/tests/test_action_widget_values.py automation_harness/tests/test_result_report_viewer.py

  java8-agent:
    name: Swing/JOGL agent (Java 8 bytecode)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - name: Build Java 8 agent
        run: bash java-agent/build.sh
      - name: Upload Java 8 agent
        uses: actions/upload-artifact@v4
        with:
          name: swing-jogl-agent
          path: java-agent/build/automation-harness-agent.jar
          if-no-files-found: error

  javafx-agent:
    name: JavaFX agent
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build JavaFX agent
        run: bash javafx_agent/build.sh
      - name: Upload JavaFX agent
        uses: actions/upload-artifact@v4
        with:
          name: javafx-agent
          path: javafx_agent/build/automation-harness-javafx-agent.jar
          if-no-files-found: error

  pytest-plan-adapter:
    name: Pytest plan adapter (Python 3.12 / headless reference)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python 3.12 test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[pytest]'
      - name: Verify automation-pytest entry point
        run: automation-pytest --help > /dev/null
      - name: Verify plan collector, result metadata, teardown, and real reference execution
        run: python -m pytest -q --tb=long automation_harness/tests/test_pytest_plan_adapter.py
